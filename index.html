<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>手势花园</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the camera (or a dusk sky) fills the screen; a slim top bar, a row of gesture cards along the bottom, a start card in the middle. */
:root{
  --ink:#fbf7ff; --dim:rgba(251,247,255,.66); --glass:rgba(18,14,38,.44); --line:rgba(255,255,255,.18);
  --sakura:#ffc4d6; --gold:#ffe6a6;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Songti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#120e2a;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{display:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:calc(12px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.14em;text-shadow:0 1px 12px rgba(0,0,0,.5);margin-right:auto}
.btn{font:inherit;font-size:.84rem;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none;white-space:nowrap}
.btn.on{background:var(--sakura);color:#2a1531;border-color:var(--sakura);font-weight:500}
.btn:focus-visible{outline:2px solid var(--sakura);outline-offset:3px}
.cards{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.g{width:150px;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .4s,box-shadow .4s,transform .4s}
.g b{display:block;font-family:var(--display);font-size:.95rem;letter-spacing:.06em}
.g span{display:block;font-size:.7rem;color:var(--dim);line-height:1.45;margin-top:2px}
.g.found{border-color:rgba(255,230,166,.7);box-shadow:0 0 18px -4px rgba(255,230,166,.7)}
.g.found b::after{content:" ✓";color:var(--gold);font-family:var(--body);font-size:.8rem}
.g.flash{transform:translateY(-6px)}
.count{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:var(--dim);text-shadow:0 1px 8px #000}
.layer{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.intro{width:min(520px,100%);text-align:center;display:grid;gap:16px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:28px 24px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.intro h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.16em;text-shadow:0 0 30px rgba(255,196,214,.5)}
.intro p{margin:0;color:var(--dim);font-size:.9rem;line-height:1.75;text-wrap:balance}
.intro .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.intro .btn{font-size:.95rem;padding:11px 20px}
.status{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:.82rem;color:var(--ink);text-shadow:0 1px 8px #000;text-align:center;pointer-events:none;max-width:90vw}
@media (max-width:640px){.g{width:calc(50% - 4px)}.g span{display:none}.count{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.g{transition:none}}
</style>

<canvas id="cv"></canvas>
<video id="video" playsinline muted></video>

<div class="top">
  <div class="brand">手势花园</div>
  <button class="btn" id="cam">开启摄像头</button>
  <button class="btn" id="clear">清空花园</button>
  <a class="btn" href="https://lauralin-lab.github.io/moon-keys/game.html" target="_blank" rel="noopener">接花瓣游戏</a>
  <a class="btn" href="https://lauralin-lab.github.io/moon-keys/practice.html" target="_blank" rel="noopener">指法练习</a>
</div>
<div class="status" id="status"></div>
<div class="count" id="count">已发现 0 / 5 种花</div>
<div class="cards" id="cards"></div>

<div class="layer" id="intro">
  <div class="intro">
    <h1>手势花园</h1>
    <p>你的手就是花。握拳蓄力，张开就开花；捏一下种一颗种子；捏住拖动，长出一条花藤。<br>每朵花都会唱一个音，开过的花会留在画面里，慢慢长成你的花园。</p>
    <div class="row"><button class="btn on" id="goCam">开启摄像头开始</button><button class="btn" id="goMouse">先用鼠标试试</button></div>
    <p style="font-size:.78rem">鼠标：按住再松开＝握拳张开 · 按住拖动＝花藤 · 快速划过＝花吹雪 · 双击＝満開</p>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),video=$('video');
let W=0,H=0,DPR=1,motes=[];
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  motes=Array.from({length:Math.round(W*H/10000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,v:Math.random()*.25+.05,p:Math.random()*6}))}
addEventListener('resize',resize);resize();
const U=()=>Math.min(W,H);

/* ---------------- sound: everything lands on a C major pentatonic, so nothing sounds wrong ---------------- */
let ac,out,rev,dly;
function audio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(ac.destination);
  out=ac.createGain();out.gain.value=.8;out.connect(comp);
  const conv=ac.createConvolver(),len=ac.sampleRate*3.5,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  conv.buffer=ir;rev=ac.createGain();rev.gain.value=.6;rev.connect(conv);const rg=ac.createGain();rg.gain.value=.6;conv.connect(rg);rg.connect(comp);
  dly=ac.createDelay(1);dly.delayTime.value=.45;const fb=ac.createGain();fb.gain.value=.35;dly.connect(fb);fb.connect(dly);dly.connect(rev);
  // a soft bed underneath
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.03,ac.currentTime+4);f.connect(g);g.connect(rev);g.connect(out);
  [36,43,48,52].forEach(m=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=(Math.random()-.5)*12;o.connect(f);o.start()})}
const hz=m=>440*2**((m-69)/12);
const PENTA=[0,2,4,7,9];
function scaleNote(k){k=Math.max(0,Math.min(19,Math.round(k)));return 48+12*Math.floor(k/5)+PENTA[k%5]}
const noteAtY=y=>scaleNote((1-y/H)*16+2);
function pluck(m,vel=1,when=0){if(!ac)return;const t=Math.max(ac.currentTime,when);const f=hz(m),g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.26*vel,t+.006);g.gain.exponentialRampToValueAtTime(.0005,t+2.8);g.connect(out);g.connect(rev);g.connect(dly);
  [[1,1,2.8],[2,.38,1.5],[3,.14,.9],[4,.05,.5]].forEach(([h,a,d])=>{const o=ac.createOscillator(),og=ac.createGain();o.frequency.value=f*h*(1+(h-1)*.0008);og.gain.setValueAtTime(a,t);og.gain.exponentialRampToValueAtTime(.0004,t+d);o.connect(og);og.connect(g);o.start(t);o.stop(t+2.9)})}
function bell(m,vel=.6,when=0){if(!ac)return;const t=Math.max(ac.currentTime,when),g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06*vel,t+.003);g.gain.exponentialRampToValueAtTime(.0004,t+1.6);g.connect(dly);g.connect(out);
  [1,2.76,5.4].forEach((r,i)=>{const o=ac.createOscillator(),og=ac.createGain();o.frequency.value=hz(m+12)*r;og.gain.value=[1,.3,.1][i];o.connect(og);og.connect(g);o.start(t);o.stop(t+1.7)})}
function swell(root,amt){if(!ac)return;const t=ac.currentTime,f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.linearRampToValueAtTime(1800*amt+600,t+.6);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07*amt,t+.25);g.gain.exponentialRampToValueAtTime(.0005,t+4);f.connect(g);g.connect(rev);g.connect(out);
  [root,root+7,root+12,root+16].forEach(m=>[-7,7].forEach(d=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=d;o.connect(f);o.start(t);o.stop(t+4.2)}))}

/* ---------------- flowers ---------------- */
const garden=[],fx=[],petals=[],vines=[],seeds=[];
function petalPath(r,w=.6){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*w*.9,-r*.35,r*w,-r*.95,0,-r*1.1);ctx.bezierCurveTo(-r*w,-r*.95,-r*w*.9,-r*.35,0,0);ctx.closePath()}
// kind: sakura (5 petals), star (6 thin), peony (two rings), bud (4 small)
function flower(x,y,r,rot,h,a,kind='sakura',open=1){if(r<=.3)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
  const ring=(n,rr,w,l,off)=>{for(let p=0;p<n;p++){ctx.save();ctx.rotate(off+p*Math.PI*2/n);ctx.scale(1,.35+.65*open);petalPath(rr,w);const g=ctx.createLinearGradient(0,0,0,-rr);g.addColorStop(0,'#fff');g.addColorStop(1,`hsl(${h} 85% ${l}%)`);ctx.fillStyle=g;ctx.fill();ctx.restore()}};
  if(kind==='peony'){ring(8,r*1.15,.55,74,0);ring(6,r*.8,.62,82,.3);ring(5,r*.48,.7,90,.1)}
  else if(kind==='star')ring(6,r,.32,80,0);
  else if(kind==='bud')ring(4,r,.75,84,0);
  else ring(5,r,.6,78,0);
  ctx.beginPath();ctx.arc(0,0,r*.16,0,7);ctx.fillStyle='#fff2c6';ctx.fill();
  if(kind!=='bud')for(let k=0;k<6;k++){const a2=k*1.047+.3;ctx.beginPath();ctx.arc(Math.cos(a2)*r*.26,Math.sin(a2)*r*.26,r*.035+.6,0,7);ctx.fillStyle='#ffd77a';ctx.fill()}
  ctx.restore();ctx.globalAlpha=1}
function glow(x,y,r,h,a,l=78){if(r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${h},90%,${l}%,${a})`);g.addColorStop(1,`hsla(${h},90%,${l}%,0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
let hueBase=330;const nextHue=()=>{hueBase=(hueBase+23+Math.random()*20)%360;return hueBase};
function plant(x,y,r,kind,h,delay=0){garden.push({x,y,r,kind,h,rot:Math.random()*6,born:performance.now()+delay,life:45000});if(garden.length>160)garden.shift()}
function burstPetals(x,y,n,h,sp=3.4){for(let k=0;k<n;k++){const a=Math.random()*6.3,v=.8+Math.random()*sp;petals.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.16,life:1,h:h+(Math.random()-.5)*30})}}
function ring(x,y,r,h,s=1){fx.push({x,y,r,h,t:0,s})}

/* ---------------- gesture discoveries ---------------- */
const GEST=[
  ['palm','掌に咲く','握拳，停一下，再张开。握得越久花越大'],
  ['seed','種まき','拇指和食指捏一下再松开'],
  ['vine','藤の道','捏住不放，拖动画线，松开满藤开花'],
  ['sweep','花吹雪','张开手掌快速挥过去'],
  ['burst','満開','两只手张开，从中间往两边拉开']];
const found=new Set();
function renderCards(){$('cards').innerHTML=GEST.map(([k,n,d])=>`<div class="g${found.has(k)?' found':''}" id="g_${k}"><b>${n}</b><span>${d}</span></div>`).join('');$('count').textContent=`已发现 ${found.size} / 5 种花`}
let banner=null;
function discover(k){if(found.has(k))return;found.add(k);renderCards();const el=$('g_'+k);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700)}
  const g=GEST.find(x=>x[0]===k);banner={a:'新しい花',b:g[1],t:0};if(found.size===5)setTimeout(()=>{banner={a:'花園完成',b:'五种花全部开过了',t:0}},2200)}

/* ---------------- the five blooms ---------------- */
function bloomPalm(x,y,charge){const h=nextHue(),r=U()*(.045+.065*charge),kind=charge>.75?'peony':'sakura';
  plant(x,y,r,kind,h);ring(x,y,r,h,1+charge);burstPetals(x,y,14+charge*30,h,3+charge*3);
  const k0=Math.round((1-y/H)*16+2);[0,2,4,7].slice(0,2+Math.round(charge*2)).forEach((d,i)=>pluck(scaleNote(k0+d),.9-i*.12,ac&&ac.currentTime+i*.07));
  swell(scaleNote(k0)-12,.4+charge*.6);discover('palm');shake=charge*5}
function bloomSeed(x,y){const h=nextHue();plant(x,y,U()*.028,'star',h);ring(x,y,U()*.02,h,.6);burstPetals(x,y,6,h,1.5);pluck(noteAtY(y),.8);bell(noteAtY(y),.5);discover('seed')}
function bloomVine(v){if(v.pts.length<3)return;const step=Math.max(26,U()*.045);let acc=0,k=0;const t0=ac?ac.currentTime:0;
  for(let i=1;i<v.pts.length;i++){const a=v.pts[i-1],b=v.pts[i];acc+=Math.hypot(b.x-a.x,b.y-a.y);
    if(acc>=step){acc=0;const d=k*.09;const h=(v.h+k*9)%360;plant(b.x,b.y,U()*(.018+Math.random()*.012),k%3===0?'sakura':'bud',h,d*1000);
      setTimeout(()=>{ring(b.x,b.y,U()*.012,h,.5);burstPetals(b.x,b.y,3,h,1)},d*1000);pluck(noteAtY(b.y),.55,t0+d);k++;if(k>40)break}}
  v.done=true;if(k>=4)discover('vine')}
function bloomBurst(x,y,span){const h=nextHue(),n=12;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=span*.5;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*.7;plant(px,py,U()*.04,i%2?'sakura':'star',(h+i*18)%360,i*45)}
  plant(x,y,U()*.11,'peony',h,200);ring(x,y,span*.3,h,3);burstPetals(x,y,90,h,7);
  const t0=ac?ac.currentTime:0;[0,2,4,5,7,9,10,12].forEach((k,i)=>pluck(scaleNote(5+k),.7,t0+i*.06));swell(36,1);flash=.6;shake=8;discover('burst')}

/* ---------------- input: hands (camera) and mouse ---------------- */
const hands={};let shake=0,flash=0;
function handState(id){return hands[id]||(hands[id]={id,open:false,closedAt:0,charge:0,pinch:false,pinchAt:0,vine:null,palm:null,pp:null,speed:0,lastSeen:0,sweepCool:0,tickAt:0,tips:[]})}
function updHand(st,f){ // f: {palm:{x,y}, openness, pinchD, pinchPt, tips}
  const now=performance.now();st.lastSeen=now;st.pp=st.palm||f.palm;st.palm=f.palm;st.speed=Math.hypot(st.palm.x-st.pp.x,st.palm.y-st.pp.y);st.tips=f.tips;
  const wasOpen=st.open;
  if(f.openness<1.3&&!st.pinch){if(st.open||!st.closedAt){st.open=false;st.closedAt=now}}
  else if(f.openness>1.65){st.open=true}
  // charging fist
  if(!st.open&&st.closedAt){const held=(now-st.closedAt)/1000;st.charge=Math.min(1,Math.max(0,(held-.15)/1.4));
    if(held>.3&&now-st.tickAt>380){st.tickAt=now;bell(scaleNote(4+Math.round(st.charge*8)),.35)}}
  if(st.open&&!wasOpen&&st.closedAt){const held=(now-st.closedAt)/1000;if(held>.18&&held<6)bloomPalm(st.palm.x,st.palm.y,st.charge);st.closedAt=0;st.charge=0}
  // pinch: seed or vine
  if(!st.pinch&&f.pinchD<.3&&f.openness>1.0){st.pinch=true;st.pinchAt=now;st.vine={pts:[{...f.pinchPt}],h:nextHue(),done:false};vines.push(st.vine);if(vines.length>14)vines.shift()}
  else if(st.pinch){if(f.pinchD>.45){st.pinch=false;const v=st.vine;st.vine=null;let len=0;for(let i=1;i<v.pts.length;i++)len+=Math.hypot(v.pts[i].x-v.pts[i-1].x,v.pts[i].y-v.pts[i-1].y);
      if(len<U()*.08){vines.splice(vines.indexOf(v),1);bloomSeed(f.pinchPt.x,f.pinchPt.y)}else bloomVine(v)}
    else{const l=st.vine.pts[st.vine.pts.length-1];if(Math.hypot(f.pinchPt.x-l.x,f.pinchPt.y-l.y)>4)st.vine.pts.push({...f.pinchPt})}}
  // sweep
  if(st.open&&!st.pinch&&st.speed>U()*.035&&now-st.sweepCool>130){st.sweepCool=now;const h=nextHue();
    (st.tips.length?st.tips:[st.palm]).forEach(p=>{for(let k=0;k<3;k++)petals.push({x:p.x,y:p.y,vx:(st.palm.x-st.pp.x)*.12+(Math.random()-.5)*2,vy:(st.palm.y-st.pp.y)*.12-1+(Math.random()-.5)*2,r:3+Math.random()*4,rot:Math.random()*6,vr:.1,life:1,h:h+(Math.random()-.5)*40})});
    pluck(noteAtY(st.palm.y),.45);st.sweepN=(st.sweepN||0)+1;if(st.sweepN>6)discover('sweep')}
  if(st.speed<U()*.01)st.sweepN=0}
// two-hand pull apart
let spread={d:0,t:0,cool:0};
function checkBurst(){const hs=Object.values(hands).filter(h=>performance.now()-h.lastSeen<200&&h.open&&h.palm);if(hs.length<2){spread.d=0;return}
  const [a,b]=hs,d=Math.hypot(a.palm.x-b.palm.x,a.palm.y-b.palm.y),now=performance.now();
  if(!spread.d||d<spread.d){spread.d=d;spread.t=now}
  if(d-spread.d>W*.28&&now-spread.t<900&&now-spread.cool>2500){spread.cool=now;bloomBurst((a.palm.x+b.palm.x)/2,(a.palm.y+b.palm.y)/2,d);spread.d=0}
  if(now-spread.t>900){spread.d=d;spread.t=now}}

// mouse / touch: hold = fist, drag = vine, flick = sweep, double-click = burst
let ptr=null;
cv.addEventListener('pointerdown',e=>{audio();ptr={x:e.clientX,y:e.clientY,down:performance.now(),moved:0,vine:{pts:[{x:e.clientX,y:e.clientY}],h:nextHue(),done:false},px:e.clientX,py:e.clientY};vines.push(ptr.vine)});
cv.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;
  if(ptr){ptr.moved+=Math.hypot(x-ptr.x,y-ptr.y);ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=x;ptr.y=y;const l=ptr.vine.pts[ptr.vine.pts.length-1];if(Math.hypot(x-l.x,y-l.y)>4)ptr.vine.pts.push({x,y})}
  else{mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=x;mouse.y=y;const v=Math.hypot(mouse.x-mouse.px,mouse.y-mouse.py);
    if(v>U()*.05&&performance.now()-mouse.cool>130){mouse.cool=performance.now();const h=nextHue();for(let k=0;k<5;k++)petals.push({x,y,vx:(x-mouse.px)*.1+(Math.random()-.5)*2,vy:(y-mouse.py)*.1-1,r:3+Math.random()*4,rot:0,vr:.1,life:1,h});pluck(noteAtY(y),.4);mouse.n++;if(mouse.n>6)discover('sweep')}
    if(v<3)mouse.n=0}});
const mouse={x:0,y:0,px:0,py:0,cool:0,n:0};
addEventListener('pointerup',e=>{if(!ptr)return;const held=(performance.now()-ptr.down)/1000;
  if(ptr.moved>U()*.08){bloomVine(ptr.vine)}else{vines.splice(vines.indexOf(ptr.vine),1);if(held>.25)bloomPalm(ptr.x,ptr.y,Math.min(1,(held-.15)/1.4));else bloomSeed(ptr.x,ptr.y)}ptr=null});
cv.addEventListener('dblclick',e=>bloomBurst(e.clientX,e.clientY,U()*.6));

/* ---------------- camera + MediaPipe Hands ---------------- */
const HANDS='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
let camOn=false,hp=null,busy=false,stream=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Hands)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function status(t,ms){$('status').textContent=t;clearTimeout(status.t);if(ms)status.t=setTimeout(()=>$('status').textContent='',ms)}
async function startCam(){audio();status('正在打开摄像头…');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false})}
  catch(e){status('这里打不开摄像头。请在电脑的 Chrome 里打开 lauralin-lab.github.io/moon-keys ，并允许摄像头。现在可以先用鼠标玩。',9000);return false}
  video.srcObject=stream;await video.play();camOn=true;$('cam').classList.add('on');$('cam').textContent='摄像头已开启';
  status('加载手部识别（首次约 10 秒）…');
  try{await loadScript(HANDS+'hands.js');hp=new Hands({locateFile:f=>HANDS+f});
    hp.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});hp.onResults(onHands);await hp.initialize();
    status('把手举到镜头前。先试试：握拳，停一下，张开',6000);pump();return true}
  catch(e){status('手部识别加载失败，需要联网。可以先用鼠标玩。',8000);return false}}
async function pump(){if(!camOn)return;if(video.readyState>=2&&!busy){busy=true;try{await hp.send({image:video})}catch(e){}busy=false}requestAnimationFrame(pump)}
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function onHands(res){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s,ox=(W-dw)/2,oy=(H-dh)/2;
  const P=p=>({x:W-(ox+p.x*dw),y:oy+p.y*dh});
  (res.multiHandLandmarks||[]).forEach((lm,i)=>{const lab=(res.multiHandedness&&res.multiHandedness[i]&&res.multiHandedness[i].label)||('h'+i);
    const palmSize=D(lm[0],lm[9])||1e-3;const openness=[8,12,16,20].reduce((a,j)=>a+D(lm[j],lm[0]),0)/4/palmSize;
    const pinchD=D(lm[4],lm[8])/palmSize;const pp=P({x:(lm[4].x+lm[8].x)/2,y:(lm[4].y+lm[8].y)/2});
    updHand(handState(lab),{palm:P(lm[9]),openness,pinchD,pinchPt:pp,tips:[4,8,12,16,20].map(j=>P(lm[j]))})});
  checkBurst()}

/* ---------------- drawing ---------------- */
function drawBg(T){
  if(camOn&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore();
    const g=ctx.createRadialGradient(W/2,H/2,U()*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(20,10,40,0)');g.addColorStop(1,'rgba(20,10,40,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#120c2c');g.addColorStop(.6,'#3d2860');g.addColorStop(1,'#a3628a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let k=0;k<3;k++)glow(W*(.5+.4*Math.sin(T/9000+k*2.1)),H*(.5+.3*Math.cos(T/11000+k*1.7)),Math.max(W,H)*.45,(hueBase+k*50)%360,.12,62)}
  for(const s of motes){s.y-=s.v;if(s.y<-4){s.y=H+4;s.x=Math.random()*W}ctx.globalAlpha=.2+.4*(.5+.5*Math.sin(T/700+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x+Math.sin(T/2000+s.p)*6,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1}

function drawVines(T){ctx.lineCap='round';ctx.lineJoin='round';
  for(const v of vines){if(v.pts.length<2)continue;const age=v.done?(performance.now()-(v.doneAt||(v.doneAt=performance.now())))/45000:0;const a=Math.max(0,1-age);if(a<=0)continue;
    ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(v.pts[0].x,v.pts[0].y);for(let i=1;i<v.pts.length;i++){const p=v.pts[i],q=v.pts[i-1];ctx.quadraticCurveTo(q.x,q.y,(p.x+q.x)/2,(p.y+q.y)/2)}
    ctx.strokeStyle='rgba(30,40,24,.55)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle=`hsla(${(v.h+120)%360},50%,72%,.85)`;ctx.lineWidth=2;ctx.stroke();
    for(let i=6;i<v.pts.length;i+=7){const p=v.pts[i],q=v.pts[i-1],an=Math.atan2(p.y-q.y,p.x-q.x)+(i%14?1:-1)*1.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(an);ctx.beginPath();ctx.ellipse(7,0,7,3,0,0,7);ctx.fillStyle=`hsla(${(v.h+110)%360},45%,62%,.8)`;ctx.fill();ctx.restore()}
    ctx.globalAlpha=1}}

function drawGarden(T){const now=performance.now();
  for(let i=garden.length-1;i>=0;i--){const f=garden[i],age=now-f.born;if(age<0)continue;if(age>f.life){garden.splice(i,1);continue}
    const grow=Math.min(1,age/700),e=1-Math.pow(1-grow,3),fade=age>f.life-6000?(f.life-age)/6000:1,sway=Math.sin(T/1600+i)*2;
    if(grow<1)glow(f.x,f.y,f.r*3,f.h,.5*(1-grow),82);glow(f.x,f.y,f.r*1.8,f.h,.18*fade,80);
    flower(f.x+sway,f.y,f.r*(.3+.7*e),f.rot+T/9000,f.h,.95*fade,f.kind,e)}}

function drawHands(T){const now=performance.now();
  for(const st of Object.values(hands)){if(now-st.lastSeen>300||!st.palm)continue;
    st.tips.forEach((p,i)=>{glow(p.x,p.y,10,(hueBase+i*20)%360,.7,90)});
    if(!st.open&&st.closedAt){const r=U()*(.025+.05*st.charge),k=.5+.5*Math.sin(T/(140-st.charge*80));glow(st.palm.x,st.palm.y,r*3.5,hueBase,.4+.4*st.charge,82);
      flower(st.palm.x,st.palm.y,r*(.9+k*.1),T/700,hueBase,.95,'bud',.25+st.charge*.3);
      ctx.beginPath();ctx.arc(st.palm.x,st.palm.y,r*2.2,-Math.PI/2,-Math.PI/2+Math.PI*2*st.charge);ctx.strokeStyle='rgba(255,230,166,.85)';ctx.lineWidth=3;ctx.stroke()}
    if(st.pinch&&st.vine){const l=st.vine.pts[st.vine.pts.length-1];glow(l.x,l.y,22,st.vine.h,.8,88)}}
  if(ptr){const held=(now-ptr.down)/1000;if(ptr.moved<U()*.08&&held>.25){const c=Math.min(1,(held-.15)/1.4),r=U()*(.025+.05*c);glow(ptr.x,ptr.y,r*3.5,hueBase,.5+.4*c,82);flower(ptr.x,ptr.y,r,T/700,hueBase,.95,'bud',.3+c*.3);
    ctx.beginPath();ctx.arc(ptr.x,ptr.y,r*2.2,-Math.PI/2,-Math.PI/2+Math.PI*2*c);ctx.strokeStyle='rgba(255,230,166,.85)';ctx.lineWidth=3;ctx.stroke();
    if(now-(ptr.tick||0)>380&&held>.3){ptr.tick=now;bell(scaleNote(4+Math.round(c*8)),.35)}}}}

function drawFx(){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=.014;if(f.t>1.6){fx.splice(i,1);continue}
    for(let k=0;k<3;k++){const tt=f.t-k*.16;if(tt<0)continue;const a=Math.max(0,1-tt/1.4);ctx.beginPath();ctx.arc(f.x,f.y,f.r+tt*U()*.18*f.s,0,7);ctx.strokeStyle=`hsla(${f.h},90%,85%,${a*.7})`;ctx.lineWidth=(3-k)*a+.5;ctx.stroke()}}
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.vx*=.97;p.vy=p.vy*.97+.05;p.x+=p.vx+Math.sin(p.y/60)*.3;p.y+=p.vy;p.rot+=p.vr;p.life-=.006;if(p.life<=0||p.y>H+20){petals.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*1.3);petalPath(p.r);ctx.fillStyle=`hsl(${p.h} 85% 83%)`;ctx.fill();ctx.restore()}ctx.globalAlpha=1;
  if(petals.length>700)petals.splice(0,petals.length-700)}

function drawBanner(){if(!banner)return;banner.t+=.01;if(banner.t>1){banner=null;return}const a=banner.t<.12?banner.t/.12:1-(banner.t-.12)/.88;
  ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`500 ${Math.round(U()*.028)}px "Noto Sans SC",sans-serif`;ctx.fillStyle='#ffe6a6';ctx.fillText(banner.a,W/2,H*.3-U()*.06);
  ctx.font=`800 ${Math.round(U()*.075)}px "Shippori Mincho",serif`;ctx.lineWidth=6;ctx.strokeStyle='rgba(30,12,40,.5)';ctx.strokeText(banner.b,W/2,H*.3);ctx.fillStyle='#fff';ctx.fillText(banner.b,W/2,H*.3);ctx.globalAlpha=1}

function frame(T){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.3)shake=0}
  drawBg(T);drawVines(T);drawGarden(T);drawFx();drawHands(T);drawBanner();
  if(flash>0){ctx.fillStyle=`rgba(255,240,246,${flash*.3})`;ctx.fillRect(0,0,W,H);flash*=.9;if(flash<.02)flash=0}
  ctx.restore();requestAnimationFrame(frame)}

/* ---------------- ui ---------------- */
renderCards();requestAnimationFrame(frame);
$('goCam').onclick=async()=>{$('intro').hidden=true;await startCam()};
$('goMouse').onclick=()=>{audio();$('intro').hidden=true;status('按住再松开、拖动、快速划过、双击，各开一种花',6000)};
$('cam').onclick=()=>{if(!camOn){$('intro').hidden=true;startCam()}};
$('clear').onclick=()=>{garden.length=0;vines.length=0;petals.length=0};
// a few flowers so the first frame is already a garden
[[.22,.62,'sakura'],[.3,.7,'star'],[.75,.58,'sakura'],[.82,.68,'bud'],[.68,.72,'star']].forEach(([x,y,k],i)=>plant(W*x,H*y,U()*(k==='bud'?.02:.035),k,(320+i*30)%360,i*250));
})();
</script>
