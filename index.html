<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>月下花园</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed canvas is the whole world; menus and results float over it as soft glass panels. */
:root{
  --ink:#f6f2ff; --dim:rgba(246,242,255,.62); --glass:rgba(16,14,40,.42); --line:rgba(255,255,255,.16);
  --sakura:#ffc2d4; --gold:#ffe7a8;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Songti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0b22;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{display:none}
.layer{position:fixed;inset:0;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.menu{width:min(760px,100%);display:grid;gap:22px;text-align:center}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.18em;margin:0;line-height:1.1;text-shadow:0 0 40px rgba(255,194,212,.45)}
.tag{margin:0;color:var(--dim);font-size:.95rem;letter-spacing:.06em;line-height:1.7;text-wrap:balance}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;text-align:left}
.lv{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:grid;gap:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
.lv:hover{transform:translateY(-3px);border-color:rgba(255,194,212,.6)}
.lv:focus-visible,.btn:focus-visible{outline:2px solid var(--sakura);outline-offset:3px}
.lv h3{margin:0;font-family:var(--display);font-size:1.25rem;letter-spacing:.06em}
.lv p{margin:0;font-size:.78rem;color:var(--dim);line-height:1.55}
.lv .meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--dim);margin-top:4px}
.stars{color:var(--gold);letter-spacing:2px;font-size:.9rem}
.stars i{font-style:normal;opacity:.25}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none}
.btn.on{background:var(--sakura);color:#2a1531;border-color:var(--sakura);font-weight:500}
.how{font-size:.8rem;color:var(--dim);line-height:1.7;margin:0}
.result{width:min(420px,100%);background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:26px 24px 20px;display:grid;gap:14px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.result h2{margin:0;font-family:var(--display);font-size:1.5rem;letter-spacing:.1em}
.bigstars{font-size:2.4rem;color:var(--gold);letter-spacing:8px}
.bigstars i{font-style:normal;opacity:.2}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 4px}
.grid3 b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;font-family:var(--display)}
.grid3 span{font-size:.7rem;color:var(--dim)}
.note{font-size:.82rem;color:var(--dim);line-height:1.6;margin:0}
.quit{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:5}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--dim);text-align:center;pointer-events:none;max-width:90vw}
@media (prefers-reduced-motion:reduce){.lv{transition:none}}
</style>

<canvas id="cv"></canvas>
<video id="video" playsinline muted></video>

<div class="layer" id="menu">
  <div class="menu">
    <div>
      <h1 class="logo">月下花园</h1>
      <p class="tag">花瓣随着节拍落下。挥手接住它，曲子就从你手里一个音一个音开出来。<br>连击越长，伴奏越满。</p>
    </div>
    <div class="levels" id="levels"></div>
    <div class="row">
      <button class="btn" id="cam">开启摄像头，用手挥</button>
      <a class="btn" href="https://lauralin-lab.github.io/moon-keys/practice.html" target="_blank" rel="noopener">指法练习</a>
    </div>
    <p class="how" id="how">不开摄像头：用鼠标或手指在屏幕上划过花瓣。开摄像头：手举到镜头前，用食指尖或手掌去划。<br>花瓣落到发光的圈缩到最小那一刻接住，就是「満開」。</p>
  </div>
</div>

<div class="layer" id="result" hidden><div class="result" id="resultBody"></div></div>
<button class="btn quit" id="quit" hidden>退出</button>
<div class="status" id="status"></div>

<script>
(()=>{
/* ---------------- music data (public-domain melodies) ---------------- */
const C=[48],G=[55];
const LEVELS={
  chocho:{name:'蝴蝶',jp:'ちょうちょう',sub:'春の朝 · 入门',desc:'日本春天的童谣，油菜花上飞的蝴蝶。节奏舒缓，先从这里开始。',
    bpm:104,loops:2,hue:330,sky:['#2a1840','#7b4a7c','#f2a9b9'],
    rh:[[[67,1],[64,1],[64,2],[65,1],[62,1],[62,2],[60,1],[62,1],[64,1],[65,1],[67,1],[67,1],[67,2]],
        [[67,1],[64,1],[64,1],[64,1],[65,1],[62,1],[62,1],[62,1],[60,1],[64,1],[67,1],[67,1],[64,1],[64,1],[64,2]],
        [[62,1],[62,1],[62,1],[62,1],[62,1],[64,1],[65,2],[64,1],[64,1],[64,1],[64,1],[64,1],[65,1],[67,2]],
        [[67,1],[64,1],[64,1],[64,1],[65,1],[62,1],[62,1],[62,1],[60,1],[64,1],[67,1],[67,1],[60,3]]],
    lh:[[[0,48],[3,55],[6,48],[10,48]],[[0,48],[4,55],[8,48],[12,48]],[[0,55],[4,55],[7,48],[11,48]],[[0,48],[4,55],[8,48],[12,48]]]},
  ode:{name:'欢乐颂',jp:'歓喜の歌',sub:'夏の夜 · 普通',desc:'贝多芬第九交响曲的主题。音一级一级地走，手要跟着左右滑。',
    bpm:112,loops:2,hue:170,sky:['#071c26','#0f4550','#5aa39b'],
    rh:[[[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1],[64,1.5],[62,.5],[62,2]],
        [[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1],[62,1.5],[60,.5],[60,2]]],
    lh:[[[0,48],[4,55],[8,48],[12,55]],[[0,48],[4,55],[8,48],[12,55],[14,48]]]},
  moon:{name:'月光',jp:'月光ソナタ',sub:'月夜 · 困难',desc:'贝多芬《月光奏鸣曲》开头的三连音。花瓣像水波一样一起一伏，要连着挥。',
    bpm:126,loops:3,hue:250,sky:['#05061a','#141a4a','#3a3f86'],moon:true,
    rh:[[[56,1],[61,1],[64,1],[56,1],[61,1],[64,1],[56,1],[61,1],[64,1],[56,1],[61,1],[64,1]],
        [[56,1],[61,1],[64,1],[56,1],[61,1],[64,1],[57,1],[61,1],[64,1],[57,1],[61,1],[64,1]],
        [[57,1],[62,1],[66,1],[57,1],[62,1],[66,1],[56,1],[61,1],[64,1],[56,1],[61,1],[64,2]]],
    lh:[[[0,49]],[[0,47]],[[0,45],[6,44]]]}
};
const FREE={name:'自由花园',sub:'没有对错 · 放松',desc:'像 Bloom 一样，在哪里划都只会开出好听的音。你弹过的旋律会慢慢回响。',hue:285,sky:['#0d0b26','#2b1f55','#6a4b8f']};
const NAMES=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const nm=m=>NAMES[m%12];

/* ---------------- canvas ---------------- */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),video=$('video');
let W=0,H=0,DPR=1,motes=[];
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  motes=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.25+.05,p:Math.random()*6}));
  if(lvl&&lvl.rh)buildTree();}
addEventListener('resize',resize);

/* ---------------- audio ---------------- */
let ac,out,lp,rev,dly;
function audio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(ac.destination);
  lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=16000;lp.Q.value=.7;lp.connect(comp);
  out=ac.createGain();out.gain.value=.85;out.connect(lp);
  const conv=ac.createConvolver(),len=ac.sampleRate*3.2,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  conv.buffer=ir;rev=ac.createGain();rev.gain.value=.5;rev.connect(conv);const rg=ac.createGain();rg.gain.value=.55;conv.connect(rg);rg.connect(lp);
  dly=ac.createDelay(1);dly.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.38;dly.connect(fb);fb.connect(dly);dly.connect(rev);const dg=ac.createGain();dg.gain.value=.4;dly.connect(dg);dg.connect(out);}
const hz=m=>440*2**((m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0005,t+dec)}
function pluck(m,vel=1,when){audio();const t=Math.max(when||0,ac.currentTime),f=hz(m);const g=ac.createGain();env(g,t,.005,.3*vel,2.6);g.connect(out);g.connect(rev);
  [[1,1,2.6],[2,.4,1.5],[3,.16,.9],[4,.06,.5]].forEach(([h,a,d])=>{const o=ac.createOscillator(),og=ac.createGain();o.frequency.value=f*h*(1+(h-1)*.0008);og.gain.setValueAtTime(a,t);og.gain.exponentialRampToValueAtTime(.0004,t+d);o.connect(og);og.connect(g);o.start(t);o.stop(t+2.7)})}
function bass(m,when){const t=Math.max(when,ac.currentTime);const g=ac.createGain();env(g,t,.01,.28,1.6);g.connect(out);g.connect(rev);
  const o=ac.createOscillator();o.type='triangle';o.frequency.value=hz(m);o.connect(g);o.start(t);o.stop(t+1.7);
  const s=ac.createOscillator();s.frequency.value=hz(m-12);const sg=ac.createGain();sg.gain.value=.5;s.connect(sg);sg.connect(g);s.start(t);s.stop(t+1.7)}
function pad(m,when,dur){const t=Math.max(when,ac.currentTime);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=ac.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+Math.min(.8,dur*.4));g.gain.linearRampToValueAtTime(0,t+dur+.6);f.connect(g);g.connect(rev);g.connect(out);
  [m,m+7,m+12].forEach((n,i)=>[-6,6].forEach(dt=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=hz(n);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+.7)}))}
function bell(m,when){const t=Math.max(when,ac.currentTime);const g=ac.createGain();env(g,t,.003,.07,1.4);g.connect(dly);g.connect(out);
  [1,2.76,5.4].forEach((r,i)=>{const o=ac.createOscillator();o.frequency.value=hz(m+24)*r;const og=ac.createGain();og.gain.value=[1,.3,.12][i];o.connect(og);og.connect(g);o.start(t);o.stop(t+1.5)})}
function thud(){const t=ac.currentTime;const g=ac.createGain();env(g,t,.005,.12,.35);g.connect(out);const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.3);o.connect(g);o.start(t);o.stop(t+.4);
  lp.frequency.cancelScheduledValues(t);lp.frequency.setValueAtTime(lp.frequency.value,t);lp.frequency.exponentialRampToValueAtTime(700,t+.08);lp.frequency.exponentialRampToValueAtTime(16000,t+1.4)}

/* ---------------- game state ---------------- */
const FALL=2.3,WIN=.24,PERF=.075,GOOD=.15;
const LAYERS=[[0,'旋律'],[8,'＋ 低音'],[16,'＋ 和声'],[28,'＋ 钟声']];
let lvl=null,lkey='',state='menu',notes=[],bassEv=[],t0=0,combo=0,maxCombo=0,score=0,counts={p:0,g:0,o:0,m:0},endT=0,pitchLo=48,pitchHi=72;
const fx=[],petals=[],pops=[],echoes=[];let flash=0,shake=0,lastNote=null,lastNoteT=0;
function layer(){let k=0;LAYERS.forEach((l,i)=>{if(combo>=l[0])k=i});return k}
function now(){return ac?ac.currentTime-t0:0}

function buildChart(L){notes=[];bassEv=[];const spb=60/L.bpm;let tb=0;
  for(let lp=0;lp<L.loops;lp++){L.rh.forEach((ph,pi)=>{const lh=L.lh[pi]||[];ph.forEach(([m,b],i)=>{const t=tb*spb;notes.push({m,t,st:'wait',x:0,y:0});
      const l=lh.find(x=>x[0]===i);if(l)bassEv.push({m:l[1],t,done:false});tb+=b})});tb+=2}
  for(let i=0;i<bassEv.length;i++)bassEv[i].dur=((bassEv[i+1]?bassEv[i+1].t:bassEv[i].t+4*spb)-bassEv[i].t);
  pitchLo=Math.min(...notes.map(n=>n.m))-1;pitchHi=Math.max(...notes.map(n=>n.m))+1;
  endT=notes[notes.length-1].t+2.2;}
const noteX=m=>W*(.14+.72*(m-pitchLo)/Math.max(1,pitchHi-pitchLo));
const lineY=()=>H*.6;
const PR=()=>Math.max(18,Math.min(W,H)*.036);
function hue(m){return ((lvl?lvl.hue:300)+(m%12)*14)%360}

function start(key){audio();ac.resume&&ac.resume();lkey=key;lvl=key==='free'?FREE:LEVELS[key];
  $('menu').hidden=true;$('result').hidden=true;$('quit').hidden=false;combo=0;maxCombo=0;score=0;counts={p:0,g:0,o:0,m:0};fx.length=0;echoes.length=0;
  if(key==='free'){state='free';droneStart();setStatus(camOn?'挥手开花 · 你弹过的会慢慢回响':'在屏幕上点或划 · 你弹过的会慢慢回响');return}
  buildChart(lvl);buildTree();grown=[];t0=ac.currentTime+3;state='play';setStatus('')}
function quit(){state='menu';droneStop();$('quit').hidden=true;$('result').hidden=true;$('menu').hidden=false;renderMenu();setStatus('')}

/* the branch: one blossom per note, coloured when you got it in full bloom */
let tree={segs:[],slots:[]},grown=[];
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function buildTree(){const r=rng(lkey.length*7919+13),segs=[],slots=[],unit=Math.min(W,H*1.5);
  (function grow(x,y,a,len,w,d,o){const bd=(r()-.5)*.6,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len,cx=x+Math.cos(a+bd)*len*.5,cy=y+Math.sin(a+bd)*len*.5;segs.push({x,y,cx,cy,ex,ey,w,o});
    for(const t of [.5,.85,1]){const q=1-t;slots.push({x:q*q*x+2*q*t*cx+t*t*ex+(r()-.5)*w*3,y:q*q*y+2*q*t*cy+t*t*ey+(r()-.5)*w*3,o:o+t,rot:r()*6})}
    if(d<=0)return;const n=d>3?2:1+(r()<.6);for(let k=0;k<n;k++)grow(ex,ey,a+(k?1:-1)*(.35+r()*.5),len*(.66+r()*.12),w*.68,d-1,o+1)})(W+unit*.02,H*.1,Math.PI-.15,unit*.2,Math.max(5,unit*.011),5,0);
  slots.forEach(s=>s.y=Math.min(s.y,H*.42));slots.sort((a,b)=>a.o-b.o);
  const N=notes.length||1;tree={segs,slots:Array.from({length:N},(_,i)=>slots[Math.floor(i*slots.length/N)])}}

/* ---------------- input: cursors ---------------- */
const cursors=new Map(); // id -> {x,y,px,py,seen,trail,kind,cool}
function cur(id,x,y,kind){let c=cursors.get(id);const tn=performance.now();if(!c){c={x,y,px:x,py:y,trail:[],kind,cool:0};cursors.set(id,c)}
  c.px=c.x;c.py=c.y;c.x=x;c.y=y;c.seen=tn;c.trail.push({x,y,t:tn});return c}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)cur('p'+e.pointerId,e.clientX,e.clientY,'ptr')});
cv.addEventListener('pointerdown',e=>{audio();const c=cur('p'+e.pointerId,e.clientX,e.clientY,'ptr');if(state==='free')freeNote(c.x,c.y,1)});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')cursors.delete('p'+e.pointerId)});
cv.addEventListener('pointerleave',e=>cursors.delete('p'+e.pointerId));

/* ---------------- camera hands ---------------- */
const HANDS='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
let camOn=false,hands=null,busy=false,stream=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Hands)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function startCam(){audio();setStatus('正在打开摄像头…');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false})}
  catch(e){setStatus('这个窗口不让用摄像头。打开 lauralin-lab.github.io/moon-keys 就能用手挥；现在先用鼠标或手指划。');return}
  video.srcObject=stream;await video.play();camOn=true;$('cam').classList.add('on');$('cam').textContent='摄像头已开启';
  setStatus('加载手部识别（首次约 10 秒）…');
  try{await loadScript(HANDS+'hands.js');hands=new Hands({locateFile:f=>HANDS+f});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});hands.onResults(onHands);await hands.initialize();setStatus('举起手，用食指尖或手掌去划');setTimeout(()=>setStatus(''),3000);pump()}
  catch(e){setStatus('手部识别加载失败（需要联网）。可以先用鼠标或手指划。')}}
async function pump(){if(!camOn)return;if(video.readyState>=2&&!busy){busy=true;try{await hands.send({image:video})}catch(e){}busy=false}requestAnimationFrame(pump)}
function onHands(res){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s,ox=(W-dw)/2,oy=(H-dh)/2;
  (res.multiHandLandmarks||[]).forEach((lm,i)=>{[8,9].forEach(j=>cur('h'+i+'_'+j,W-(ox+lm[j].x*dw),oy+lm[j].y*dh,j===8?'tip':'palm'))})}

/* ---------------- free garden ---------------- */
const PENTA=[0,2,4,7,9];let droneNodes=null;
function freeNote(x,y,vel,echo){const steps=15,i=Math.max(0,Math.min(steps-1,Math.floor(x/W*steps)));const m=60-12+12*Math.floor(i/5)+PENTA[i%5]+(y<H*.33?12:0);
  pluck(m,vel*(.7+.3*(1-y/H)));bloomAt(x,y,m,vel,echo);if(!echo)echoes.push({x,y,m,t:performance.now(),n:0});}
function droneStart(){if(droneNodes)return;const t=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+3);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;f.connect(g);g.connect(rev);g.connect(out);
  const os=[36,43,48].map(m=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=(Math.random()-.5)*10;o.connect(f);o.start();return o});droneNodes={g,os}}
function droneStop(){if(!droneNodes||!ac)return;const t=ac.currentTime;droneNodes.g.gain.cancelScheduledValues(t);droneNodes.g.gain.setValueAtTime(droneNodes.g.gain.value,t);droneNodes.g.gain.linearRampToValueAtTime(0,t+1.2);droneNodes.os.forEach(o=>o.stop(t+1.3));droneNodes=null}

/* ---------------- effects ---------------- */
function bloomAt(x,y,m,s=1,faint){const h=hue(m);fx.push({x,y,h,t:0,s,faint});
  const n=faint?4:Math.round(14*s);for(let k=0;k<n;k++){const a=Math.random()*6.3,v=1+Math.random()*3.4*s;petals.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.4,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.16,life:faint?.5:1,h})}}
function pop(x,y,txt,col){pops.push({x,y,txt,col,t:0})}
function setStatus(t){$('status').textContent=t}

function judge(n,c){const t=now(),dt=t-n.t;if(Math.abs(dt)>WIN)return false;
  const g=Math.abs(dt)<PERF?'p':Math.abs(dt)<GOOD?'g':'o';n.st='hit';n.g=g;counts[g]++;combo++;maxCombo=Math.max(maxCombo,combo);
  score+=({p:300,g:180,o:80})[g]*(1+Math.min(combo,50)/50);
  const when=dt<0?t0+n.t:0; // early catches still sound on the beat
  pluck(n.m,g==='p'?1:.8,when);if(layer()>=3)bell(n.m,when);
  bloomAt(n.x,n.y,n.m,g==='p'?1.25:g==='g'?.95:.65);if(g==='p'){flash=.35;shake=Math.min(6,2+combo/12)}
  pop(n.x,n.y-PR()*1.8,g==='p'?'満開':g==='g'?'咲いた':'つぼみ',g==='p'?'#ffe7a8':g==='g'?'#ffd0de':'#d8d4ea');
  const i=notes.indexOf(n);grown[i]={t:0,good:g==='p',h:hue(n.m)};lastNote=n.m;lastNoteT=performance.now();
  if(c){c.cool=performance.now()}return true}

function finish(){state='done';const N=notes.length,maxS=notes.length*300*2;const acc=(counts.p*3+counts.g*2+counts.o)/(3*N);
  const stars=acc>=.88?3:acc>=.7?2:acc>=.5?1:0;try{const k='mg_best_'+lkey,b=+localStorage.getItem(k)||0;if(stars>b)localStorage.setItem(k,stars)}catch(e){}
  const st=[1,2,3].map(i=>i<=stars?'★':'<i>★</i>').join('');
  const tip=stars===3?'整枝都开满了。试试更难的一关，或者去「指法练习」用真实指法把这首弹一遍。':counts.m>N*.25?'漏掉的花瓣有点多。别追着花瓣跑，提前把手放在它要落的位置，等光圈缩到最小再划。':'早接和晚接都会变成小花。听着节拍划，比盯着花瓣更准。';
  $('resultBody').innerHTML=`<h2>${lvl.name} · ${lvl.sub.split(' · ')[0]}</h2><div class="bigstars">${st}</div>
    <div class="grid3"><div><b>${counts.p}</b><span>満開</span></div><div><b>${maxCombo}</b><span>最高连击</span></div><div><b>${Math.round(acc*100)}%</b><span>准确度</span></div></div>
    <p class="note">${tip}</p><div class="row"><button class="btn on" id="again">再来一次</button><button class="btn" id="back">选关</button></div>`;
  $('result').hidden=false;$('again').onclick=()=>start(lkey);$('back').onclick=quit;
  for(let k=0;k<70;k++)setTimeout(()=>petals.push({x:Math.random()*W,y:-10,vx:(Math.random()-.3)*1.4,vy:1+Math.random(),r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.1,life:1.8,h:hue(60+k)}),k*45)}

/* ---------------- drawing ---------------- */
function petalPath(r){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.55,-r*.35,r*.6,-r*.95,0,-r*1.1);ctx.bezierCurveTo(-r*.6,-r*.95,-r*.55,-r*.35,0,0);ctx.closePath()}
function flower(x,y,r,rot,h,a,l=78){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
  for(let p=0;p<5;p++){ctx.save();ctx.rotate(p*1.2566);petalPath(r);const g=ctx.createLinearGradient(0,0,0,-r);g.addColorStop(0,'#fff');g.addColorStop(1,`hsl(${h} 80% ${l}%)`);ctx.fillStyle=g;ctx.fill();ctx.restore()}
  ctx.beginPath();ctx.arc(0,0,r*.17,0,7);ctx.fillStyle='#fff3cf';ctx.fill();ctx.restore();ctx.globalAlpha=1}
function glow(x,y,r,h,a,l=75){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${h},90%,${l}%,${a})`);g.addColorStop(1,`hsla(${h},90%,${l}%,0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}

function drawSky(T){const L=lvl||{sky:['#0a0b22','#241a4d','#5b3f7e'],hue:300};
  if(camOn&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore();
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,L.sky[0]+'b0');g.addColorStop(.55,L.sky[1]+'40');g.addColorStop(1,L.sky[0]+'90');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,L.sky[0]);g.addColorStop(.62,L.sky[1]);g.addColorStop(1,L.sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // slow breathing colour field, the Bloom feeling
    for(let k=0;k<3;k++){const x=W*(.5+.38*Math.sin(T/9000+k*2.1)),y=H*(.45+.3*Math.cos(T/11000+k*1.7));glow(x,y,Math.max(W,H)*.45,(L.hue+k*40)%360,.13,60)}}
  if(L.moon){const mx=W*.2,my=H*.17,mr=Math.max(22,Math.min(W,H)*.05);glow(mx,my,mr*5,48,.25,90);ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fillStyle='#fff6dc';ctx.fill()}
  for(const s of motes){s.y-=s.v;if(s.y<-4){s.y=H+4;s.x=Math.random()*W}ctx.globalAlpha=.25+.4*(.5+.5*Math.sin(T/700+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x+Math.sin(T/2000+s.p)*6,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1}

function drawWater(){const y=lineY();const g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(255,255,255,.07)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W*.06,y);ctx.lineTo(W*.94,y);ctx.stroke()}

function drawTree(T){if(!tree.segs.length)return;const done=grown.filter(Boolean).length,N=tree.slots.length||1,reach=1+done/N*6;ctx.lineCap='round';
  for(const s of tree.segs){if(s.o>reach)continue;const a=Math.min(1,reach-s.o);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(s.cx,s.cy,s.x+(s.ex-s.x)*a,s.y+(s.ey-s.y)*a);
    ctx.strokeStyle='rgba(24,14,26,.8)';ctx.lineWidth=s.w;ctx.stroke();ctx.strokeStyle='rgba(255,236,226,.22)';ctx.lineWidth=Math.max(1,s.w*.22);ctx.stroke()}
  const R=Math.max(9,Math.min(W,H)*.018);tree.slots.forEach((sl,i)=>{const g=grown[i];if(!g)return;g.t=Math.min(1,g.t+.05);const e=1-Math.pow(1-g.t,3);
    flower(sl.x+Math.sin(T/1500+i)*1.5,sl.y,R*(g.good?1.1:.65)*e,sl.rot,g.good?g.h:250,g.good?.95:.55,g.good?78:86)})}

function drawNotes(T){const t=now(),R=PR(),ly=lineY();
  for(const n of notes){if(n.st!=='wait')continue;const dt=n.t-t;if(dt>FALL)break;
    if(dt<-WIN){n.st='miss';counts.m++;if(combo>=4)thud();combo=0;pop(n.x,ly-R*1.6,'散った','#a8a6c4');petals.push({x:n.x,y:ly,vx:0,vy:1.2,r:R*.5,rot:0,vr:.04,life:.8,h:250,grey:true});continue}
    const p=1-dt/FALL,e=1-Math.pow(1-Math.min(1,p),2);n.x=noteX(n.m)+Math.sin(T/600+n.t*3)*W*.012*(1-e);n.y=-R*2+(ly+R*2)*e;
    const h=hue(n.m);glow(n.x,n.y,R*2.6,h,.5);
    if(dt<.9){const k=Math.max(0,dt)/.9;ctx.beginPath();ctx.arc(n.x,n.y,R*(1.05+k*2.6),0,7);ctx.strokeStyle=`hsla(${h},90%,85%,${.9-k*.6})`;ctx.lineWidth=2;ctx.stroke()}
    flower(n.x,n.y,R*.95,T/1800+n.t,h,.95);
    if(Math.abs(dt)<WIN&&cursors.size)for(const c of cursors.values()){if(performance.now()-c.seen>250)continue;
      if(segDist(n.x,n.y,c.px,c.py,c.x,c.y)<R*1.9){judge(n,c);break}}}}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let u=l?((px-ax)*dx+(py-ay)*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(px-ax-u*dx,py-ay-u*dy)}

function drawFx(){const R=PR();
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=.016;if(f.t>1.6){fx.splice(i,1);continue}
    for(let k=0;k<3;k++){const tt=f.t-k*.18;if(tt<0)continue;const a=Math.max(0,1-tt/1.4);ctx.beginPath();ctx.arc(f.x,f.y,R*(1+tt*6*f.s),0,7);ctx.strokeStyle=`hsla(${f.h},90%,82%,${a*(f.faint?.35:.7)})`;ctx.lineWidth=(3-k)*a+.4;ctx.stroke()}
    if(f.t<.8){glow(f.x,f.y,R*6*f.s,f.h,(1-f.t/.8)*(f.faint?.2:.55),80);const e=1-Math.pow(1-Math.min(1,f.t*2.5),3);flower(f.x,f.y,R*2*e*f.s,f.t,f.h,(1-f.t/.8)*(f.faint?.5:1))}}
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.vx*=.97;p.vy=p.vy*.97+.055;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0065;if(p.life<=0||p.y>H+20){petals.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*1.3);petalPath(p.r);ctx.fillStyle=p.grey?'rgba(170,168,196,.8)':`hsl(${p.h} 85% 82%)`;ctx.fill();ctx.restore()}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=.02;if(p.t>1){pops.splice(i,1);continue}ctx.globalAlpha=1-p.t*p.t;ctx.font=`800 ${Math.round(R*(.8+(1-p.t)*.25))}px "Shippori Mincho",serif`;ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y-p.t*R*1.2)}ctx.globalAlpha=1}

function drawCursors(){const tn=performance.now();ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  for(const [id,c] of cursors){while(c.trail.length&&tn-c.trail[0].t>(state==='free'?1800:450))c.trail.shift();
    if(tn-c.seen>600&&c.kind!=='ptr'){cursors.delete(id);continue}
    const w=c.kind==='palm'?9:6;for(let j=1;j<c.trail.length;j++){const a=1-(tn-c.trail[j].t)/(state==='free'?1800:450);ctx.beginPath();ctx.moveTo(c.trail[j-1].x,c.trail[j-1].y);ctx.lineTo(c.trail[j].x,c.trail[j].y);
      ctx.strokeStyle=`hsla(${hue(60+j)},90%,80%,${a*.5})`;ctx.lineWidth=w*(.4+a);ctx.stroke()}
    if(tn-c.seen<300){glow(c.x,c.y,w*4,hue(64),.6,88)}
    if(state==='free'&&c.kind!=='ptr'){const v=Math.hypot(c.x-c.px,c.y-c.py);if(v>16&&tn-c.cool>170){c.cool=tn;freeNote(c.x,c.y,Math.min(1,v/40))}}}
  ctx.restore()}

function drawHud(){const R=PR(),t=now();ctx.textAlign='left';ctx.textBaseline='top';
  const pad=Math.max(16,W*.02);ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`700 ${Math.round(R*.7)}px "Shippori Mincho",serif`;ctx.fillText(Math.round(score).toLocaleString(),pad,pad);
  ctx.font=`500 ${Math.round(R*.42)}px "Noto Sans SC",sans-serif`;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText(lvl.name+' · '+lvl.sub,pad,pad+R*.9);
  // progress
  const pr=Math.max(0,Math.min(1,t/endT));ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(0,0,W,3);ctx.fillStyle='rgba(255,210,225,.8)';ctx.fillRect(0,0,W*pr,3);
  ctx.textAlign='center';
  if(combo>=2){const s=1+Math.min(.5,combo/80);ctx.font=`800 ${Math.round(R*1.25*s)}px "Shippori Mincho",serif`;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillText(combo,W/2,pad*.6);
    ctx.font=`500 ${Math.round(R*.42)}px "Noto Sans SC",sans-serif`;ctx.fillStyle='rgba(255,231,168,.85)';ctx.fillText('连击 · '+LAYERS.slice(0,layer()+1).map(l=>l[1]).join(' '),W/2,pad*.6+R*1.4*s)}
  if(t<0){ctx.font=`800 ${Math.round(R*2.4)}px "Shippori Mincho",serif`;ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(Math.ceil(-t),W/2,H*.32)}}

function drawKeys(){const m0=pitchLo-3,m1=pitchHi+3,BL=[1,3,6,8,10];const whites=[];for(let m=m0;m<=m1;m++)if(!BL.includes(m%12))whites.push(m);
  const kh=Math.min(56,H*.07),kw=Math.min(30,W*.8/whites.length),x0=(W-kw*whites.length)/2,y0=H-kh-10-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('padding-bottom'))||0);
  const lit=performance.now()-lastNoteT<300?lastNote:null;const pos={};
  whites.forEach((m,i)=>{pos[m]=x0+i*kw;ctx.fillStyle=m===lit?`hsl(${hue(m)} 90% 85%)`:'rgba(255,255,255,.82)';ctx.fillRect(x0+i*kw+1,y0,kw-2,kh);
    if(m%12===0){ctx.fillStyle='rgba(40,30,60,.5)';ctx.font=`500 ${Math.round(kw*.38)}px "Shippori Mincho",serif`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('ド',x0+i*kw+kw/2,y0+kh-3)}});
  for(let m=m0;m<=m1;m++)if(BL.includes(m%12)&&pos[m-1]!=null){const x=pos[m-1]+kw*.68;ctx.fillStyle=m===lit?`hsl(${hue(m)} 80% 60%)`:'rgba(20,16,36,.92)';ctx.fillRect(x,y0,kw*.64,kh*.6)}
  if(lit!=null){ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font=`700 ${Math.round(kh*.36)}px "Shippori Mincho",serif`;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(nm(lit),W/2,y0-6)}}

function tick(){if(state!=='play'||!ac)return;const t=now(),L=layer();
  for(const b of bassEv){if(b.done)continue;if(b.t-t>.12)break;b.done=true;if(L>=1)bass(b.m,t0+b.t);if(L>=2)pad(b.m+12,t0+b.t,b.dur)}
  if(t>endT&&state==='play')finish()}
setInterval(tick,25);

function frame(T){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.3)shake=0}
  drawSky(T);
  if(state==='play'||state==='done'){drawTree(T);drawWater();if(state==='play')drawNotes(T);drawFx();drawKeys();drawCursors();if(state==='play')drawHud()}
  else{if(state==='free'){drawWater()}drawFx();drawCursors();
    if(state==='free'){const tn=performance.now();for(let i=echoes.length-1;i>=0;i--){const e=echoes[i];const due=e.t+(e.n+1)*6200;if(tn>=due){e.n++;const v=[.5,.3,.16][e.n-1];if(v){pluck(e.m,v);fx.push({x:e.x,y:e.y,h:hue(e.m),t:0,s:.7,faint:true})}if(e.n>=3)echoes.splice(i,1)}}}}
  if(flash>0){ctx.fillStyle=`rgba(255,240,245,${flash*.18})`;ctx.fillRect(0,0,W,H);flash*=.85;if(flash<.02)flash=0}
  ctx.restore();requestAnimationFrame(frame)}

/* ---------------- menu ---------------- */
function best(k){try{return +localStorage.getItem('mg_best_'+k)||0}catch(e){return 0}}
function renderMenu(){const box=$('levels');box.innerHTML='';
  [...Object.entries(LEVELS),['free',FREE]].forEach(([k,L])=>{const b=document.createElement('button');b.className='lv';
    const s=best(k),st=k==='free'?'':[1,2,3].map(i=>i<=s?'★':'<i>★</i>').join('');
    b.innerHTML=`<h3>${L.name}</h3><p>${L.desc}</p><div class="meta"><span>${L.sub}</span><span class="stars">${st}</span></div>`;
    b.style.background=`linear-gradient(160deg,${L.sky[1]}cc,${L.sky[0]}cc)`;b.onclick=()=>start(k);box.appendChild(b)})}
$('cam').onclick=()=>camOn?null:startCam();
$('quit').onclick=quit;
addEventListener('keydown',e=>{if(e.key==='Escape'&&state!=='menu')quit()});

resize();renderMenu();requestAnimationFrame(frame);
// a little ambient life on the title screen
setInterval(()=>{if(state==='menu'&&document.visibilityState==='visible'){lvl=lvl||null;fx.push({x:Math.random()*W,y:H*(.55+Math.random()*.35),h:(300+Math.random()*80)%360,t:0,s:.6,faint:true})}},1400);
})();
</script>

</body></html>
